services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: vincebus-ftp-prod
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    networks:
      - vincebus-network

  db:
    image: mysql:8.4
    container_name: vincebus-ftp-db-prod
    restart: always
    environment:
      MYSQL_DATABASE: vincebus_ftp
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_USER: vincebus
      MYSQL_PASSWORD: secure_password
    volumes:
      - mysql_prod_data:/var/lib/mysql
    networks:
      - vincebus-network

networks:
  vincebus-network:
    driver: bridge

volumes:
  mysql_prod_data:
