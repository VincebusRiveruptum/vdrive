services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: vincebus-ftp-prod
    restart: always
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - .:/var/www/html
    networks:
      - vincebus-network

  nginx:
    image: nginx:alpine
    container_name: vincebus-ftp-nginx-prod
    restart: always
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - vincebus-network

  db:
    image: postgres:14
    container_name: vincebus-ftp-db-prod
    restart: always
    env_file:
      - ./.env.production
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - vincebus-network

networks:
  vincebus-network:
    driver: bridge

volumes:
  postgres_prod_data: