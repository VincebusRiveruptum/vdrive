services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: vdrive-prod
    restart: always
    env_file:
      - ./.prod.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - app_data:/var/www/html
    networks:
      - vdrive-network

  nginx:
    image: nginx:alpine
    container_name: vdrive-nginx-prod
    restart: always
    ports:
      - "80:80"
    volumes:
      - app_data:/var/www/html
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - vdrive-network

  db:
    image: postgres:14
    container_name: vdrive-db-prod
    restart: always
    env_file:
      - ./.prod.env
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - vdrive-network

networks:
  vdrive-network:
    driver: bridge

volumes:
  postgres_prod_data:
  app_data: # ← volumen compartido entre app y nginx
