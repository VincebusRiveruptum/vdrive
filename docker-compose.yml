services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vincebus-ftp-app
    restart: unless-stopped
    ports:
      - "8001:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - .:/var/www/html
    networks:
      - vincebus-network
  node:
    image: node:20-alpine
    container_name: vincebus-ftp-node
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: npm run dev
    ports:
      - "5173:5173"
    networks:
      - vincebus-network

  db:
    image: mysql:8.4
    container_name: vincebus-ftp-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vincebus_ftp
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: vincebus
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - vincebus-network

networks:
  vincebus-network:
    driver: bridge

volumes:
  mysql_data:
