services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vincebus-ftp-app
    restart: unless-stopped
    ports:
      - "8001:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - .:/var/www/html
    networks:
      - vincebus-network
  node:
    image: node:20-alpine
    container_name: vincebus-ftp-node
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: npm run dev
    ports:
      - "5173:5173"
    networks:
      - vincebus-network

  db:
    image: postgres:14
    container_name: vincebus-ftp-db
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vincebus-network

networks:
  vincebus-network:
    driver: bridge

volumes:
  postgres_data:
